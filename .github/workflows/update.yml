name: Update calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests before generation
        run: pytest -q

      - name: Generate calendar
        run: python update_calendar.py

      - name: Validate generated files
        run: pytest -q

      - name: Commit changed outputs
        run: |
          if git diff --quiet -- calendar.ics data/events.json; then
            echo "Generated files are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics data/events.json
          git commit -m "chore: update cycling calendar"
          git push

